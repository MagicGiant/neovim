set -g @nova-segment-mode-colors "#{{colors.primary.default.hex_stripped}} #{{colors.background.default.hex_stripped}}"
set -g @nova-segment-whoami-colors "#{{colors.primary.default.hex_stripped}} #{{colors.background.default.hex_stripped}}"


set -g @nova-status-style-bg "#{{colors.background.default.hex_stripped}}"
set -g @nova-status-style-fg "#{{colors.primary.default.hex_stripped}}"
set -g @nova-status-style-active-bg "#{{colors.primary.default.hex_stripped}}"
set -g @nova-status-style-active-fg "#{{colors.background.default.hex_stripped}}"

set -g pane-border-style "fg=#{{colors.background.default.hex_stripped}}"
set -g pane-active-border-style "fg=#{{colors.primary.default.hex_stripped}}"
