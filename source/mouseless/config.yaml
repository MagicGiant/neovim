baseMouseSpeed: 750.0
baseScrollSpeed: 20.0

layers:
- name: initial
  bindings:
    rightalt: toggle-layer mouse
- name: mouse
  passThrough: true
  bindings:
    q: layer initial
    d: move  1  0
    a: move -1  0
    s: move  0  1
    w: move  0 -1
    p: scroll up
    n: scroll down
    leftalt: speed 0.3
    capslock: speed 3 
    m: button left
    comma: button right
    h: left
    j: down
    k: up
    l: right
    o: multi end; enter
    b: leftctrl+left
    leftshift+k4: end
    k0: home
