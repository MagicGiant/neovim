baseMouseSpeed: 750.0
baseScrollSpeed: 20.0

layers:
- name: initial
  bindings:
    rightalt: toggle-layer mouse
- name: mouse
  passThrough: true
  bindings:
    q: layer initial
    d: move  1  0
    a: move -1  0
    s: move  0  1
    w: move  0 -1
    p: scroll up
    n: scroll down
    leftshift: speed 3.0
    leftalt: speed 0.3
    i: button left
    o: button right
    h: left
    j: down
    k: up
    l: right
